# =============================================================
# Glauser Illnau AG – Serviceauftrag-Verwaltung
# application.properties – Schritt 19 (Kenan)
# =============================================================

# Datenbankverbindung (Passwort via Umgebungsvariable DB_PASSWORD)
spring.datasource.url=jdbc:postgresql://localhost:5432/serviceauftrag
spring.datasource.username=sa_user
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Server
server.port=8080

# Fehlermeldungen
server.error.include-message=always
